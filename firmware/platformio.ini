; Moiré disc drive: ESP32 + two or three 28BYJ-48 steppers
;
;   env            board                 driver     motors
;   esp32c3        ESP32-C3 SuperMini    ULN2003    2   (default; the boards that come with the motors)
;   esp32c3-tmc    ESP32-C3 SuperMini    TMC2209    3   (quiet; motors need the bipolar mod)
;   esp32s3        ESP32-S3 SuperMini    ULN2003    3
;   esp32dev       classic ESP32 board   ULN2003    3
;
; Pins are listed per board below and in README.md.
; ESP32-C6 needs Arduino core 3.x: use the pioarduino platform (commented env at the bottom).

[env]
framework = arduino
monitor_speed = 115200

[c3]
platform = espressif32 @ 6.12.0
board = esp32-c3-devkitm-1
c3_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32c3]
platform = ${c3.platform}
board = ${c3.board}
build_flags =
    ${c3.c3_flags}
    -DDRIVER_ULN2003
    -DULN_M1=0,1,3,4
    -DULN_M2=5,6,7,10

[env:esp32c3-tmc]
platform = ${c3.platform}
board = ${c3.board}
lib_deps = teemuatlut/TMCStepper@^0.7.3
build_flags =
    ${c3.c3_flags}
    -DDRIVER_TMC2209
    -DPIN_TMC_TX=7
    -DPIN_TMC_RX=6
    -DPIN_TMC_EN=10

[env:esp32s3]
platform = espressif32 @ 6.12.0
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDRIVER_ULN2003
    -DULN_M1=1,2,4,5
    -DULN_M2=6,7,8,9
    -DULN_M3=10,11,12,13

[env:esp32dev]
platform = espressif32 @ 6.12.0
board = esp32dev
build_flags =
    -DDRIVER_ULN2003
    -DULN_M1=13,12,14,27
    -DULN_M2=26,25,33,32
    -DULN_M3=23,22,21,19

